name: Deploy

on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    # environment: must live on the job that actually runs (this one), not on the
    # caller job in publish.yml — "environment" isn't a supported keyword for a
    # job that only calls a reusable workflow via `uses:`.
    environment: ${{ inputs.environment_name }}
    permissions:
      contents: read
      id-token: write
    steps:
      # Migrations go first: the images never apply them (prisma is a devDependency and
      # is not in the runtime image), so without this step new code can reach a database
      # with an old schema. `migrate deploy` only applies committed migration files — it
      # never diffs the schema, so it cannot drop the hnsw indexes the way `migrate dev`
      # does. A failed migration stops the job before any container is replaced.
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @flash-sale/db...
        env:
          # postinstall runs `prisma generate`, which reads DATABASE_URL but never
          # connects; a placeholder keeps the real secret out of the install step.
          DATABASE_URL: postgresql://user:pass@localhost:5432/flash_sale
      - name: Apply database migrations
        env:
          # Environment secret (stage / production). Must be the DIRECT connection
          # (port 5432), not the pooler — see packages/db/CLAUDE.md.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set for environment '${{ inputs.environment_name }}'" >&2
            exit 1
          fi
          pnpm --filter @flash-sale/db migrate:deploy

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # No SSH: the instance has no inbound port open and the SSM agent dials out, so
      # the deploy is a command sent to one instance the role is scoped to.
      - name: Deploy over SSM
        env:
          INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters commands='[
              "set -e",
              "cd /home/deployer/flash-sale",
              "runuser -u deployer -- git pull",
              "docker compose -f docker-compose.prod.yml pull",
              "docker compose -f docker-compose.prod.yml up -d --remove-orphans",
              "sleep 15",
              "docker compose -f docker-compose.prod.yml ps",
              "test -z \"$(docker compose -f docker-compose.prod.yml ps --status=exited --status=dead -q)\"",
              "docker image prune -f"
            ]' \
            --query Command.CommandId --output text)

          echo "command: $COMMAND_ID"

          # `wait` exits non-zero on a failed command, and the output is worth printing
          # either way — the status is checked explicitly below.
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query Status --output text)

          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query StandardErrorContent --output text >&2
            echo "deploy finished with status $STATUS" >&2
            exit 1
          fi
