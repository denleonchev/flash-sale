name: Build and publish Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and push all images even if nothing relevant changed (e.g. to seed a new tag)
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/flash_sale
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @flash-sale/db generate
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm -r test

  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      worker: ${{ steps.filter.outputs.worker }}
      caddy: ${{ steps.filter.outputs.caddy }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'tsconfig.base.json'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'tsconfig.base.json'
            worker:
              - 'apps/worker/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'tsconfig.base.json'
            caddy:
              - 'apps/caddy/**'
            infra:
              - 'docker-compose.prod.yml'
              - 'Caddyfile'
              - '.github/workflows/**'
              - 'infra/**'

  build-api:
    needs: [test, changes]
    if: needs.test.result == 'success' && (needs.changes.outputs.api == 'true' || inputs.force == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/flash-sale-api:latest
            ghcr.io/${{ github.repository_owner }}/flash-sale-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  # web bakes NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY into the client bundle at build
  # time (apps/web/Dockerfile), and stage/prod use different Stripe test keys —
  # so, unlike api/worker, web needs a separate build per environment. These are
  # plain repo secrets (not GitHub Environment secrets) so the build itself isn't
  # gated by the production environment's required-reviewers rule — only the
  # deploy-prod job below is gated.
  build-web-stage:
    needs: [test, changes]
    if: needs.test.result == 'success' && (needs.changes.outputs.web == 'true' || inputs.force == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/flash-sale-web:stage-latest
            ghcr.io/${{ github.repository_owner }}/flash-sale-web:stage-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_STAGE }}
          cache-from: type=gha,scope=web-stage
          cache-to: type=gha,mode=max,scope=web-stage

  build-web-prod:
    needs: [test, changes]
    if: needs.test.result == 'success' && (needs.changes.outputs.web == 'true' || inputs.force == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/flash-sale-web:prod-latest
            ghcr.io/${{ github.repository_owner }}/flash-sale-web:prod-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_PROD }}
          cache-from: type=gha,scope=web-prod
          cache-to: type=gha,mode=max,scope=web-prod

  build-worker:
    needs: [test, changes]
    if: needs.test.result == 'success' && (needs.changes.outputs.worker == 'true' || inputs.force == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/flash-sale-worker:latest
            ghcr.io/${{ github.repository_owner }}/flash-sale-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  build-caddy:
    needs: changes
    if: needs.changes.outputs.caddy == 'true' || inputs.force == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/caddy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/flash-sale-caddy:latest
            ghcr.io/${{ github.repository_owner }}/flash-sale-caddy:${{ github.sha }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy

  deploy-stage:
    needs: [test, changes, build-api, build-web-stage, build-worker, build-caddy]
    # Run if at least one build succeeded; skip if all were skipped (no relevant changes).
    if: |
      always() && (
        (needs.test.result == 'success' && (
          needs.build-api.result == 'success' ||
          needs.build-web-stage.result == 'success' ||
          needs.build-worker.result == 'success'
        )) ||
        needs.build-caddy.result == 'success' ||
        needs.changes.outputs.infra == 'true'
      )
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment_name: stage
    secrets: inherit

  deploy-prod:
    needs: [deploy-stage, build-web-prod]
    # Deploy prod whenever stage deployed successfully, regardless of whether
    # build-web-prod ran this time (web may be unchanged → job is 'skipped', which
    # is fine) — but not if it actually ran and failed/was cancelled.
    if: |
      always() &&
      needs.deploy-stage.result == 'success' &&
      needs.build-web-prod.result != 'failure' &&
      needs.build-web-prod.result != 'cancelled'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      # "production" Environment has a required-reviewers protection rule (set up
      # in repo Settings → Environments) — deploy.yml's job pauses for manual
      # approval before production's secrets.GCP_* are resolved and the SSH
      # deploy runs.
      environment_name: production
    secrets: inherit
